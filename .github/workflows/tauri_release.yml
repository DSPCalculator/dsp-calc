name: Build Tauri desktop app on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event.deleted == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable toolchain
        id: rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install locked Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The locked npm CLI invokes beforeBuildCommand with TAURI_ENV_PLATFORM,
      # building the frontend once with relative assets and no service worker.
      - name: Build Tauri app (exe only, no installer)
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --no-bundle --ci -- --locked

      - name: Package exe and license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = 'src-tauri/target/x86_64-pc-windows-msvc/release/dsp-calc.exe'
          $safeTag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '_'
          $zipName = "dsp-calc-$safeTag-windows-x64.zip"
          Compress-Archive -LiteralPath $exePath, 'LICENSE' -DestinationPath $zipName

      - name: Upload Windows archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tauri-windows-x64
          path: dsp-calc-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Preserve the inherited release permission only where it is needed.
    # Tagged source and dependency scripts never run with this write token.
    permissions:
      contents: write
    steps:
      - name: Download this run's Windows archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tauri-windows-x64
          path: release-assets

      - name: Refuse to change an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > releases.json
          if ! jq -e --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag and .draft == false)] | length == 0' releases.json; then
            echo 'This tag already has a published release; leave it unchanged.' >&2
            exit 1
          fi

      - name: Create draft GitHub release and upload zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: dsp-calc ${{ github.ref_name }}
          body: |
            ## 戴森球计划量化计算器 — Windows 桌面版

            ### 下载说明
            - **`dsp-calc-*-windows-x64.zip`** — 解压后直接运行 `dsp-calc.exe`，无需安装

            > **注意**：需要系统已安装 [WebView2 运行时](https://developer.microsoft.com/zh-cn/microsoft-edge/webview2/)。
            > 此构建未进行代码签名；请审核后再发布此草稿。
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*.zip
